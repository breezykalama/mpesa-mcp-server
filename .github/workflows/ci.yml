name: CI

on:
  push:
  pull_request:

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # gitleaks-action scans the commit range (<first>^..<last>) of each push and
          # pull request, so the full history must be present for git to resolve it.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        # gitleaks-action v2 accepts no `with:` inputs; it is configured through env.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.24.3

  test:
    name: Test
    runs-on: ubuntu-latest

    # Disposable PostgreSQL for the durable-approval schema tests. It exists only for
    # this job, uses throwaway CI-only credentials, and is never a shared database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: mpesa_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d mpesa_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MPESA_TEST_POSTGRES_URL: postgresql+psycopg://ci_test:ci_test@localhost:5432/mpesa_ci_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Compile Python modules
        run: python -m compileall app tests scripts alembic

      - name: Run tests
        # -rs lists skip reasons; fail if the PostgreSQL schema tests were skipped.
        # `shell: bash` enables pipefail so a pytest failure is not masked by `tee`.
        shell: bash
        run: |
          uv run pytest -rs | tee pytest-output.txt
          if grep -q "MPESA_TEST_POSTGRES_URL is not set" pytest-output.txt; then
            echo "::error::PostgreSQL schema tests were skipped in CI"
            exit 1
          fi

      - name: Run ruff
        run: uv run ruff check app tests scripts alembic

      - name: Run mypy
        run: uv run mypy app tests scripts

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Pinned to Node 24 LTS. Node 26 defines a global localStorage getter that
          # returns undefined without --localstorage-file, shadowing jsdom in Vitest.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build
